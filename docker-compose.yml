services:
  pulse:
    build: .
    image: pulse:local
    container_name: pulse
    restart: unless-stopped
    # Run as your host user so ./data and ./fixtures stay owned by you (see README).
    user: "${PULSE_UID:-1000}:${PULSE_GID:-1000}"
    env_file:
      - path: .env
        required: true
    environment:
      PULSE_DATA_DIR: /data
      PULSE_FIXTURES_DIR: /fixtures
      # Lets `docker compose run -p 127.0.0.1:8765:8765 pulse auth` receive the redirect.
      PULSE_OAUTH_BIND_ADDR: 0.0.0.0
      # Nightly backups go to /data/backups by default. To keep them on another disk,
      # uncomment both lines below (and the matching volume) and point the host path there.
      # PULSE_BACKUP_DIR: /backups
    volumes:
      - ./data:/data
      - ./fixtures:/fixtures
      # - /mnt/backup-disk/pulse:/backups
    ports:
      - "${PULSE_BIND:-0.0.0.0}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
